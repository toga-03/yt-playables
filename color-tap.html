<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Color Tap</title>
<script src="https://www.youtube.com/game_api/v1"></script>
<style>
  :root{--bg:#1c1f2e;--fg:#f4f4f8}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
  #app{height:100%;display:flex;flex-direction:column;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));box-sizing:border-box}
  #top{display:flex;justify-content:space-between;align-items:baseline}
  #score{font-size:44px;font-weight:900}
  #best{font-size:13px;opacity:.55}
  #bar{height:10px;background:#333850;border-radius:5px;overflow:hidden;margin:14px 0}
  #fill{height:100%;background:#fff;width:100%;transform-origin:left}
  #word{flex:1;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:900;letter-spacing:.02em}
  #grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:44vh}
  .b{border:none;border-radius:22px;font-size:0;cursor:pointer;box-shadow:inset 0 -8px 0 rgba(0,0,0,.2);transition:transform .05s}
  .b:active{transform:scale(.95)}
  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(28,31,46,.92);text-align:center;padding:30px}
  #ov h1{font-size:52px;margin:0;font-weight:900}
  #ov p{margin:0;font-size:18px;line-height:1.6;opacity:.85;white-space:pre-line}
  #ov button{margin-top:20px;font-size:20px;font-weight:700;padding:16px 48px;border-radius:999px;border:none;background:#fff;color:#1c1f2e;cursor:pointer}
  .hidden{display:none!important}
  .shake{animation:sh .3s}
  @keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div id="app">
  <div id="top"><div id="score">0</div><div id="best"></div></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="word">あか</div>
  <div id="grid"></div>
</div>
<div id="ov">
  <h1>Color Tap</h1>
  <p>文字が「表す色」をタップ。
文字の色に惑わされるな。</p>
  <button id="start">スタート</button>
</div>
<script>
const YT = {
  env: typeof ytgame !== 'undefined' && ytgame.IN_PLAYABLES_ENV, audio:true,
  init(){ if(!this.env) return; this.audio=ytgame.system.isAudioEnabled(); ytgame.system.onAudioEnabledChange(v=>this.audio=v); ytgame.system.onPause(()=>paused=true); ytgame.system.onResume(()=>{paused=false;lastT=performance.now();}); },
  async load(){ try{ if(this.env){const s=await ytgame.game.loadData(); return s?JSON.parse(s):{};} }catch(e){} return {}; },
  async save(o){ if(this.env) try{ await ytgame.game.saveData(JSON.stringify(o)); }catch(e){} },
  score(v){ if(this.env) try{ ytgame.engagement.sendScore({value:v}); }catch(e){} },
  async ad(){ if(this.env&&ytgame.ads) try{ await ytgame.ads.requestInterstitialAd(); }catch(e){} },
  firstFrame(){ if(this.env) ytgame.game.firstFrameReady(); }, ready(){ if(this.env) ytgame.game.gameReady(); }
};
let actx=null;
function beep(f=440,d=.08,type='square',g=.06){ if(!YT.audio) return; try{ actx=actx||new (AudioContext||webkitAudioContext)(); const o=actx.createOscillator(),v=actx.createGain(); o.type=type;o.frequency.value=f;v.gain.value=g;o.connect(v);v.connect(actx.destination);o.start();v.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d);}catch(e){} }

const COLORS=[{n:'あか',c:'#ff4d5a'},{n:'あお',c:'#3d8bff'},{n:'みどり',c:'#2ecc71'},{n:'きいろ',c:'#ffd23f'}];
const $=id=>document.getElementById(id);
let score=0,best=0,answer=0,timeMax=2000,timeLeft=0,paused=false,playing=false,games=0,lastT=0;
const grid=$('grid');
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.className='b';b.style.background=c.c;b.textContent=c.n;b.onclick=()=>tap(i);grid.appendChild(b);});

function next(){
  answer=Math.floor(Math.random()*4);
  let ink=Math.floor(Math.random()*4); if(score<3) ink=answer;   // 最初は素直
  $('word').textContent=COLORS[answer].n; $('word').style.color=COLORS[ink].c;
  timeMax=Math.max(700,2000-score*45); timeLeft=timeMax;
}
function tap(i){
  if(!playing||paused) return;
  if(i===answer){score++;$('score').textContent=score;beep(600+score*15,.07,'sine',.07);next();}
  else over('ちがう色！');
}
async function over(reason){
  playing=false; beep(100,.4,'sawtooth',.1);
  $('app').classList.add('shake'); setTimeout(()=>$('app').classList.remove('shake'),300);
  if(score>best){best=score;await YT.save({best});}
  $('best').textContent='ベスト '+best; YT.score(score);
  $('ov').querySelector('h1').textContent=score; $('ov').querySelector('p').textContent=reason+'\nベスト '+best; $('start').textContent='もう一度';
  $('ov').classList.remove('hidden');
  if(++games%3===0) await YT.ad();
}
$('start').onclick=()=>{score=0;$('score').textContent='0';$('ov').classList.add('hidden');playing=true;lastT=performance.now();next();};
function loop(t){
  requestAnimationFrame(loop);
  if(!playing||paused){lastT=t;return;}
  timeLeft-=t-lastT; lastT=t;
  $('fill').style.transform=`scaleX(${Math.max(0,timeLeft/timeMax)})`;
  if(timeLeft<=0) over('時間切れ');
}
(async()=>{
  YT.init(); const s=await YT.load(); best=s.best||0; $('best').textContent=best?'ベスト '+best:'';
  YT.firstFrame(); requestAnimationFrame(loop); YT.ready();
})();
</script>
</body>
</html>
