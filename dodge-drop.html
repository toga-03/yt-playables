<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DODGE!</title>
<script src="https://www.youtube.com/game_api/v1"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#c4c9b0;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  #frame{background:#5d6156;padding:10px;border-radius:6px 6px 26px 6px}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#9bbc0f}
</style>
</head>
<body>
<div id="frame"><canvas id="c" width="144" height="256"></canvas></div>
<script>
const YT={env:typeof ytgame!=='undefined'&&ytgame.IN_PLAYABLES_ENV,audio:true,
 init(){if(!this.env)return;this.audio=ytgame.system.isAudioEnabled();ytgame.system.onAudioEnabledChange(v=>this.audio=v);ytgame.system.onPause(()=>paused=true);ytgame.system.onResume(()=>paused=false);},
 async load(){try{if(this.env){const s=await ytgame.game.loadData();return s?JSON.parse(s):{};}}catch(e){}return{};},
 async save(o){if(this.env)try{await ytgame.game.saveData(JSON.stringify(o));}catch(e){}},
 score(v){if(this.env)try{ytgame.engagement.sendScore({value:v});}catch(e){}},
 async ad(){if(this.env&&ytgame.ads)try{await ytgame.ads.requestInterstitialAd();}catch(e){}},
 firstFrame(){if(this.env)ytgame.game.firstFrameReady();},ready(){if(this.env)ytgame.game.gameReady();},
 lang(){try{if(this.env)return ytgame.system.getLanguage();}catch(e){}return navigator.language||'en';}};
const STR={
 ja:{t1:'DODGE!',h1:'左右にスライドして',h2:'岩をよけろ',h3:'コインで加点',tap:'- タップでスタート -',over:'GAME OVER',rec:'新記録',retry:'タップでもう一度'},
 en:{t1:'DODGE!',h1:'slide left/right',h2:'to avoid rocks',h3:'grab coins',tap:'- tap to start -',over:'GAME OVER',rec:'NEW RECORD',retry:'tap to retry'}};
let L=STR.en;
let actx=null;
function tone(f,d,g){if(!YT.audio)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),v=actx.createGain();o.type='square';o.frequency.value=f;v.gain.value=g||.05;o.connect(v);v.connect(actx.destination);o.start();v.gain.setValueAtTime(g||.05,actx.currentTime);v.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d);}catch(e){}}

// ===== 4色パレット =====
const P=['#0f380f','#306230','#8bac0f','#9bbc0f'];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=144,H=256,PY=214;
function fit(){const s=Math.min((innerWidth-20)/W,(innerHeight-20)/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',fit);fit();

// スプライト（文字=色番号, .=透明）
const SPR={
 kid:['..0000..','.033330.','.030030.','.033330.','..0330..','.000000.','0.0330.0','..0..0..'],
 rock:['..0000..','.011110.','01112110','01121110','01111110','.011110.','..0000..'],
 rockS:['.000.','01110','01210','.000.'],
 coin:['.000.','02220','02320','02220','.000.'],
};
function spr(name,x,y){const s=SPR[name];for(let j=0;j<s.length;j++)for(let i=0;i<s[j].length;i++){const c=s[j][i];if(c!=='.'){ctx.fillStyle=P[+c];ctx.fillRect(x+i,y+j,1,1);}}}
function txt(s,x,y,col,size,align){ctx.font=(size||8)+'px '+(L===STR.ja?'"Hiragino Sans",sans-serif':'monospace');ctx.fillStyle=P[col===undefined?0:col];ctx.textAlign=align||'left';ctx.textBaseline='top';ctx.fillText(s,x,y);}

let px=W/2,rocks=[],coins=[],t=0,score=0,best=0,state='title',paused=false,games=0,spawnT=0,shake=0,dragX=null,dragPX=0,frame=0;
function reset(){px=W/2;rocks=[];coins=[];t=0;score=0;spawnT=0;state='play';}
async function over(){state='over';shake=6;tone(110,.3,.08);setTimeout(()=>tone(70,.4,.08),120);
  if(score>best){best=score;await YT.save({best});}YT.score(score);games++;if(games%3===0)await YT.ad();}
function cx(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)*W/r.width;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(paused)return;if(state!=='play'){reset();return;}dragX=cx(e);dragPX=px;cv.setPointerCapture(e.pointerId);},{passive:false});
cv.addEventListener('pointermove',e=>{if(dragX!==null&&state==='play')px=Math.max(4,Math.min(W-4,dragPX+(cx(e)-dragX)*1.3));});
addEventListener('pointerup',()=>dragX=null);

let last=0;
function loop(ts){
  requestAnimationFrame(loop);if(paused){last=ts;return;}
  const dt=Math.min((ts-last)/16.7,3);last=ts;frame++;
  ctx.save();if(shake>0){ctx.translate(Math.round((Math.random()-.5)*shake),Math.round((Math.random()-.5)*shake));shake-=dt;}
  ctx.fillStyle=P[3];ctx.fillRect(-8,-8,W+16,H+16);
  // 遠景の山
  ctx.fillStyle=P[2];for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(i*40-20,PY+6);ctx.lineTo(i*40,PY-14-(i%2)*6);ctx.lineTo(i*40+20,PY+6);ctx.fill();}
  // 地面
  ctx.fillStyle=P[1];ctx.fillRect(0,PY+6,W,H);ctx.fillStyle=P[0];ctx.fillRect(0,PY+6,W,1);
  for(let i=0;i<W;i+=6)ctx.fillRect(i+(frame>>3)%6,PY+12,2,1);

  if(state==='play'){t+=dt;const d=1+t/1000;spawnT-=dt;
    if(spawnT<=0){spawnT=Math.max(10,34/d);const big=Math.random()<.6;rocks.push({x:Math.random()*(W-8),y:-8,big,vy:(1.2+Math.random()*1.1)*d});if(Math.random()<.25)coins.push({x:Math.random()*(W-5),y:-5,vy:1.3*d});}
    score=Math.floor(t/10);}
  rocks=rocks.filter(r=>r.y<H);
  rocks.forEach(r=>{if(state==='play')r.y+=r.vy*dt;spr(r.big?'rock':'rockS',Math.round(r.x),Math.round(r.y));
    const rr=r.big?3.5:2.5,rx=r.x+(r.big?4:2.5),ry=r.y+(r.big?3.5:2);
    if(state==='play'&&Math.hypot(rx-px,ry-(PY+4))<rr+3)over();});
  coins=coins.filter(c=>c.y<H&&!c.got);
  coins.forEach(c=>{if(state==='play')c.y+=c.vy*dt;if((frame>>3)%2)spr('coin',Math.round(c.x),Math.round(c.y));else{ctx.fillStyle=P[0];ctx.fillRect(Math.round(c.x)+2,Math.round(c.y),1,5);}
    if(state==='play'&&Math.hypot(c.x+2.5-px,c.y+2.5-(PY+4))<6){c.got=true;t+=50;tone(1320,.06);setTimeout(()=>tone(1760,.08),50);}});
  // 主人公（足パタパタ）
  const leg=(state==='play'&&dragX!==null&&(frame>>2)%2)?1:0;
  spr('kid',Math.round(px)-4,PY-leg);
  ctx.restore();

  // 画面上部の枠と数字
  ctx.fillStyle=P[3];ctx.fillRect(0,0,W,14);ctx.fillStyle=P[0];ctx.fillRect(0,14,W,1);
  txt('SCORE '+String(score).padStart(4,'0'),3,3,0,8);txt('HI '+String(best).padStart(4,'0'),W-3,3,0,8,'right');

  if(state==='title'){box(16,70,112,100);txt(L.t1,W/2,80,0,20,'center');txt(L.h1,W/2,110,0,8,'center');txt(L.h2,W/2,120,0,8,'center');txt(L.h3,W/2,132,1,8,'center');if((frame>>4)%2)txt(L.tap,W/2,152,0,8,'center');}
  else if(state==='over'){box(16,84,112,80);txt(L.over,W/2,94,0,12,'center');txt(String(score),W/2,112,0,20,'center');if(score>=best&&score>0)txt(L.rec,W/2,138,1,8,'center');else txt(L.retry,W/2,140,1,8,'center');}
}
function box(x,y,w,h){ctx.fillStyle=P[3];ctx.fillRect(x,y,w,h);ctx.fillStyle=P[0];ctx.fillRect(x,y,w,1);ctx.fillRect(x,y+h-1,w,1);ctx.fillRect(x,y,1,h);ctx.fillRect(x+w-1,y,1,h);ctx.fillRect(x+2,y+2,w-4,1);ctx.fillRect(x+2,y+h-3,w-4,1);}
(async()=>{YT.init();L=YT.lang().toLowerCase().startsWith('ja')?STR.ja:STR.en;const s=await YT.load();best=s.best||0;YT.firstFrame();requestAnimationFrame(loop);YT.ready();})();
</script>
</body>
</html>
